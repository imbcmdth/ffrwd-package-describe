[package]
name = "clips"
version = "0.2.0"
edition = "2021"

[lib]
name = "clips"
crate-type = ["cdylib"]

[dependencies]
describe-common = { path = "../common" }
ffrwd-node = { git = "https://github.com/imbcmdth/ffrwd-node", tag = "v0.1.0" }
# E:\projects\ffrwd-frame on its `yuv` branch, which is not merged yet: this
# moves to a tag of ffrwd-frame once it is.
ffrwd-frame = { path = "../../ffrwd-frame" }
serde = { version = "1.0.229", features = ["derive"] }
