[package]
name = "clips"
version = "0.2.0"
edition = "2021"

[lib]
name = "clips"
crate-type = ["cdylib"]

[features]
# The GPU build: a node beside ffrwd:gpu, the host making each kept frame into
# the tower's input and joining the eight. The `clips-gpu` crate builds this
# source with it on, as clips_gpu.wasm.
gpu = ["dep:wit-bindgen"]

[dependencies]
describe-common = { path = "../common" }
ffrwd-node = { git = "https://github.com/imbcmdth/ffrwd-node", tag = "v0.2.0" }
ffrwd-frame = { git = "https://github.com/imbcmdth/ffrwd-frame", tag = "v0.1.1" }
serde = { version = "1.0.229", features = ["derive"] }
# The ffrwd:gpu bindings, for the `gpu` feature alone.
wit-bindgen = { version = "0.57.1", optional = true }
