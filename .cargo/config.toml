# wasm32-wasip2 leaves SIMD off by default; enable it so a module can use it.
[target.wasm32-wasip2]
rustflags = ["-C", "target-feature=+simd128"]

# The wit comes from the installed ffrwd/wasm package: the module's
# build.rs asks `ffrwd path ffrwd/wasm` for it, so run
# `ffrwd install -g ffrwd/wasm` once before building. FFRWD_WIT_DIR
# overrides that lookup for a checkout where the package cannot be
# installed yet.
